name: Metrics

on:
  schedule:
    - cron: "0 2 * * *" # once a day
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Argyaboy20
          template: classic
          base: ""
          config_timezone: Asia/Makassar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          filename: metrics-extra.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update extra metrics"